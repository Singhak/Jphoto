# Type check, lint and the money-path tests (payments, downloads, limits) on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jphoto
          POSTGRES_PASSWORD: jphoto
          POSTGRES_DB: jphoto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jphoto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jphoto:jphoto@localhost:5432/jphoto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same as the Dockerfile.
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
